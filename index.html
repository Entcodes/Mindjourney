<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7d9e3">
<title>心灵方块书屋 · MindCraft Library</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sky">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="petals" id="petals"></div>
</div>

<header class="topbar">
  <div class="brand">
    <h1 id="appTitle">心灵方块书屋</h1>
    <p id="appSub">MindCraft Library · 心理学家与十五本书</p>
  </div>

  <div class="prof" id="prof">
    <div class="prof-stack" id="profStack"></div>
    <div class="letter-drop" id="letterDrop" aria-hidden="true"></div>
    <p class="hat-hint" id="hatHint">点帽子：换语言 + 掉一封信</p>
  </div>

  <div class="chips" id="chips">
    <div class="chip"><span class="chip-k" id="kDate">今日</span><span class="chip-v" id="vDate">—</span></div>
    <div class="chip"><span class="chip-k" id="kAsk">提问剩余</span><span class="chip-v" id="vAsk">10</span></div>
    <div class="chip"><span class="chip-k" id="kExam">考试</span><span class="chip-v" id="vExam">—</span></div>
    <div class="chip"><span class="chip-k" id="kMood">今日心情</span><span class="chip-v" id="vMood">—</span></div>
    <div class="chip lang-chip"><span class="chip-v" id="vLang">中文</span></div>
  </div>
</header>

<main class="wrap">
  <section class="stage">
    <h2 class="sec-title" id="shelfTitle">书架</h2>
    <p class="sec-hint" id="shelfHint">点一本书来读</p>

    <div class="shelf">
      <div class="plank-label" id="label1"></div>
      <div class="books-row" id="row1"></div>
      <div class="board"></div>
      <div class="plank-label" id="label2"></div>
      <div class="books-row" id="row2"></div>
      <div class="board"></div>
      <div class="plank-label" id="label3"></div>
      <div class="books-row" id="row3"></div>
      <div class="board bottom"></div>
      <div class="legs"></div>
    </div>

    <div class="grass"></div>
  </section>

  <section class="panel">
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="book"><span class="ico" data-ico="star"></span><span id="tBook">书本</span></button>
      <button class="tab" data-tab="memory"><span class="ico" data-ico="check"></span><span id="tMemory">记忆清单</span></button>
      <button class="tab" data-tab="exam"><span class="ico" data-ico="bulb"></span><span id="tExam">每日考试</span></button>
      <button class="tab" data-tab="ask"><span class="ico" data-ico="heart"></span><span id="tAsk">问教授</span></button>
      <button class="tab" data-tab="letters"><span class="ico" data-ico="letter"></span><span id="tLetters">信件柜</span></button>
    </nav>

    <div class="tab-body" id="tabBook"></div>
    <div class="tab-body hide" id="tabMemory"></div>
    <div class="tab-body hide" id="tabExam"></div>
    <div class="tab-body hide" id="tabAsk"></div>
    <div class="tab-body hide" id="tabLetters"></div>

    <p class="safety" id="safetyBox"></p>
    <footer class="foot">
      <span id="footNote"></span>
      <button class="ghost" id="resetBtn"></button>
    </footer>
  </section>
</main>

<div class="modal hide" id="modal">
  <div class="modal-card">
    <h3 id="modalTitle"></h3>
    <div id="modalBody" class="letter-body"></div>
    <div class="modal-actions"><button class="btn" id="modalClose"></button></div>
  </div>
</div>

<div class="toast hide" id="toast"></div>

<script src="js/pixel.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data-books.js"></script>
<script src="js/data-books-shelf3.js"></script>
<script src="js/data-exam.js"></script>
<script src="js/data-chat.js"></script>
<script src="js/app.js"></script>
</body>
</html>
