<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7d9e3">
<title>心灵方块书屋 · MindCraft Library</title>
<style>
/* ============ 心灵方块书屋 · Minecraft × 少女风 ============ */
:root {
  --ink: #3a2438;
  --cream: #fff6ec;
  --paper: #fffaf3;
  --pink: #f7d9e3;
  --pink-2: #e9a8bd;
  --pink-3: #c76c8c;
  --lav: #ded2f2;
  --mint: #cfe9d8;
  --sky-1: #ffe6ef;
  --sky-2: #e5dcf7;
  --wood: #e0b489;
  --wood-2: #c48f60;
  --wood-3: #9a6440;
  --wood-seam: #8a5636;
  --grass: #7cbf6a;
  --grass-2: #5aa353;
  --gold: #f2c14e;
  --shadow: 6px 6px 0 rgba(58, 36, 56, .22);
  --px: 4px;
  --font: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  --mono: "Consolas", "Courier New", monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: linear-gradient(#ffd6e4 0%, var(--sky-2) 45%, #f0e7ff 100%);
  min-height: 100vh;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}
img, .px-sprite { image-rendering: pixelated; }
.px-sprite { position: relative; flex: none; }
.px-sprite > i { display: block; position: absolute; left: 0; top: 0; background: transparent; }

/* ---------- 天空与装饰 ---------- */
.sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.cloud { position: absolute; background: #fffdf7; box-shadow: var(--shadow); opacity: .85; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: #fffdf7; }
.c1 { width: 96px; height: 28px; top: 8%; left: 8%; animation: drift 46s linear infinite; }
.c1::before { width: 36px; height: 24px; top: -18px; left: 18px; }
.c1::after { width: 28px; height: 18px; top: -10px; left: 52px; }
.c2 { width: 72px; height: 22px; top: 22%; right: 10%; animation: drift 62s linear infinite reverse; }
.c2::before { width: 28px; height: 18px; top: -13px; left: 14px; }
.c2::after { width: 20px; height: 14px; top: -8px; left: 40px; }
.c3 { width: 60px; height: 18px; top: 54%; left: 46%; animation: drift 74s linear infinite; opacity: .6; }
.c3::before { width: 22px; height: 14px; top: -10px; left: 12px; }
@keyframes drift { from { transform: translateX(-14vw); } to { transform: translateX(114vw); } }
.petal { position: absolute; width: 8px; height: 8px; background: #ffc9dc; box-shadow: 2px 2px 0 rgba(199, 108, 140, .35); top: -12px; animation: fall linear infinite; }
@keyframes fall {
  0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; }
  10% { opacity: .9; }
  100% { transform: translate(60px, 105vh) rotate(220deg); opacity: .2; }
}

/* ---------- 顶栏 ---------- */
.topbar {
  position: relative; z-index: 2;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
  gap: 14px; padding: 18px 20px 6px;
}
.brand h1 {
  margin: 0; font-size: clamp(22px, 3.4vw, 34px); letter-spacing: 2px; line-height: 1.2;
  text-shadow: 3px 3px 0 #fff, 5px 5px 0 rgba(199, 108, 140, .45);
}
.brand p { margin: 6px 0 0; font-size: 12px; letter-spacing: 1px; color: #7a5a72; }
.prof { justify-self: center; text-align: center; user-select: none; }
.prof-stack { position: relative; width: 96px; margin: 0 auto; }
.prof-stack .hat { position: relative; z-index: 3; transition: transform .12s steps(2); }
.prof-stack .hat:hover { transform: translateY(-4px); }
.prof-stack .hat:active { transform: translateY(2px) scale(.96); }
.hat-hint { font-size: 10.5px; color: #8a6280; margin: 4px 0 0; max-width: 150px; margin-inline: auto; }
.letter-drop { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); z-index: 6; pointer-events: none; }
.letter-drop.go { animation: drop 1.1s cubic-bezier(.5, .05, .7, .3) forwards; }
@keyframes drop {
  0% { transform: translate(-14px, -8px) rotate(-8deg); opacity: 0; }
  15% { opacity: 1; }
  60% { transform: translate(6px, 66px) rotate(14deg); opacity: 1; }
  100% { transform: translate(-6px, 118px) rotate(-4deg); opacity: 0; }
}

.chips { justify-self: end; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; max-width: 420px; }
.chip {
  background: var(--paper); border: 3px solid var(--ink); box-shadow: 4px 4px 0 rgba(58, 36, 56, .2);
  padding: 4px 9px; min-width: 74px;
}
.chip-k { display: block; font-size: 9.5px; letter-spacing: 1px; color: #9b7391; text-transform: uppercase; }
.chip-v { display: block; font-size: 13px; font-weight: 700; }
.lang-chip { background: var(--pink); }

/* ---------- 主体布局 ---------- */
.wrap {
  position: relative; z-index: 1;
  display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 20px; padding: 8px 20px 40px; max-width: 1500px; margin: 0 auto;
  align-items: start;
}
.stage, .panel {
  background: rgba(255, 250, 243, .92);
  border: 4px solid var(--ink);
  box-shadow: var(--shadow);
  padding: 16px 16px 18px;
  min-width: 0;
}
section.stage { min-width: 0; }
.sec-title { margin: 0; font-size: 18px; letter-spacing: 3px; }
.sec-hint { margin: 2px 0 12px; font-size: 12px; color: #8a6280; }

/* ---------- 书架（Minecraft 樱花木板） ---------- */
.shelf {
  background:
    repeating-linear-gradient(90deg, var(--wood) 0 28px, var(--wood-2) 28px 32px),
    linear-gradient(var(--wood), var(--wood-3));
  border: 4px solid var(--wood-seam);
  box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .25), var(--shadow);
  padding: 10px 12px 0;
  position: relative;
}
.board { height: 14px; background: repeating-linear-gradient(90deg, var(--wood-2) 0 18px, var(--wood-seam) 18px 22px); border-top: 3px solid var(--wood-seam); border-bottom: 3px solid #6f4326; margin-top: 8px; }
.board.bottom { margin-bottom: 0; }
.plank-label { font-size: 11px; letter-spacing: 2px; color: #5c3620; padding: 4px 2px 6px; text-shadow: 1px 1px 0 rgba(255, 255, 255, .5); }
.books-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 6px; padding: 0 4px 12px; min-height: 104px; }
.book-btn {
  background: none; border: 0; padding: 0; cursor: pointer; position: relative;
  transition: transform .14s steps(2);
  filter: drop-shadow(3px 3px 0 rgba(58, 36, 56, .35));
}
.book-btn:hover, .book-btn:focus-visible { transform: translateY(-10px); outline: none; }
.book-btn.sel { transform: translateY(-14px); }
.book-btn.sel::after {
  content: ""; position: absolute; left: 50%; bottom: -12px; width: 12px; height: 12px;
  margin-left: -6px; background: var(--gold); box-shadow: 0 0 0 3px var(--ink);
  transform: rotate(45deg);
}
.book-btn .tip {
  position: absolute; left: 50%; bottom: 104%; transform: translateX(-50%);
  background: var(--ink); color: #fff8ee; font-size: 11px; padding: 3px 8px;
  white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s;
  z-index: 5;
}
.book-btn:hover .tip, .book-btn:focus-visible .tip { opacity: 1; }
.read-badge { position: absolute; right: -6px; top: -6px; }
.grass { height: 26px; margin-top: 14px; background: repeating-linear-gradient(90deg, var(--grass) 0 10px, var(--grass-2) 10px 20px); border: 4px solid #3f7a3c; border-top-width: 8px; }
.legs { height: 0; }

/* ---------- 面板 / tabs ---------- */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.tab {
  font: inherit; font-size: 12.5px; font-weight: 700; letter-spacing: .5px;
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--lav); color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 3px 3px 0 rgba(58, 36, 56, .25);
  padding: 6px 10px; cursor: pointer;
}
.tab:hover { background: #ece2fb; }
.tab.active { background: var(--pink); box-shadow: 0 0 0 rgba(0, 0, 0, 0) inset, 2px 2px 0 rgba(58, 36, 56, .3); transform: translate(1px, 1px); }
.tab .ico { width: 15px; height: 11px; display: inline-block; overflow: hidden; }
.tab-body.hide { display: none; }

/* ---------- 书本内容 ---------- */
.book-head { display: flex; gap: 12px; align-items: flex-start; border-bottom: 3px dashed var(--pink-2); padding-bottom: 12px; margin-bottom: 12px; }
.book-head .swatch { width: 14px; height: 60px; border: 3px solid var(--ink); flex: none; }
.book-head h3 { margin: 0; font-size: 20px; }
.book-head .sub { margin: 2px 0 6px; font-size: 13px; color: #7a5a72; }
.tagline { display: inline-block; font-size: 11px; background: var(--mint); border: 2px solid var(--ink); padding: 1px 7px; }
.read-toggle { margin-left: auto; }
.narr { font-size: 13.5px; color: #4f3a4b; background: #fff1f6; border-left: 6px solid var(--pink-2); padding: 8px 10px; margin: 0 0 14px; }
.blk { margin: 0 0 16px; }
.blk > h4 { margin: 0 0 8px; font-size: 14px; letter-spacing: 1px; color: #6d3f60; border-bottom: 2px solid var(--pink); padding-bottom: 4px; }
.sent { background: var(--paper); border: 3px solid var(--ink); box-shadow: 3px 3px 0 rgba(58, 36, 56, .18); padding: 9px 10px; margin-bottom: 9px; }
.sent .line { font-size: 15px; font-weight: 700; }
.sent .note { font-size: 12px; color: #7d6076; margin-top: 4px; }
.sent .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.quote { border: 3px solid var(--ink); border-left-width: 10px; background: #fff; padding: 9px 11px; margin-bottom: 10px; }
.quote .q { font-size: 14.5px; font-style: italic; }
.quote .w { font-size: 11.5px; color: #8a6280; margin-top: 5px; letter-spacing: .4px; }
.quote .show { font-size: 12.5px; margin-top: 7px; padding-top: 6px; border-top: 2px dotted #d8c2d2; }
.method { border: 3px solid var(--ink); background: #fbf7ff; padding: 9px 11px; margin-bottom: 10px; }
.method .m-name { font-weight: 700; font-size: 14.5px; }
.method .m-src, .method .m-when { font-size: 12px; color: #6c5668; margin-top: 3px; }
.method ol { margin: 6px 0 0; padding-left: 20px; font-size: 13px; }
.method li { margin-bottom: 3px; }
.seed { display: flex; gap: 8px; align-items: center; font-size: 13.5px; background: #fffdf2; border: 2px solid var(--ink); padding: 5px 8px; margin-bottom: 6px; }
.seed span { flex: 1; }

/* ---------- 心情地图 ---------- */
.mood-card { border: 3px solid var(--ink); background: #f4fbf2; padding: 9px 10px; margin-bottom: 9px; }
.mood-card .mh { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 14px; }
.mood-card .poms { font-size: 10px; background: var(--ink); color: #fff; padding: 1px 5px; }
.mood-card .sign, .mood-card .scene, .mood-card .fit { font-size: 12px; color: #5d4a58; margin-top: 5px; }
.mood-card ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; }
.checkin { border: 3px solid var(--ink); background: var(--mint); padding: 10px 12px; }
.checkin .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.checkin label { font-size: 12px; font-weight: 700; display: block; margin-bottom: 3px; }
.checkin input[type=range] { width: 100%; accent-color: var(--pink-3); }
.picks { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.pick { font: inherit; font-size: 12px; border: 2px solid var(--ink); background: #fff; padding: 3px 8px; cursor: pointer; }
.pick.on { background: var(--pink-3); color: #fff; }
.result { margin-top: 8px; background: #fff; border: 3px solid var(--ink); padding: 9px 11px; font-size: 13px; }
.result b { display: block; margin-bottom: 4px; }

/* ---------- 记忆清单 ---------- */
.list-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.count { font-size: 12px; background: var(--ink); color: #fff; padding: 2px 8px; }
.mem-item { border: 3px solid var(--ink); background: var(--paper); box-shadow: 3px 3px 0 rgba(58, 36, 56, .16); padding: 8px 10px; margin-bottom: 8px; }
.mem-item.due { background: #fff1f6; border-color: var(--pink-3); }
.mem-item .txt { font-size: 14.5px; font-weight: 600; }
.mem-item .meta { font-size: 11.5px; color: #7d6076; margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
.mem-item .acts { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
.add-row { display: flex; gap: 8px; margin-bottom: 12px; }
.add-row input { flex: 1; }

/* ---------- 表单元素 ---------- */
input[type=text], textarea {
  font: inherit; font-size: 13.5px; color: var(--ink);
  border: 3px solid var(--ink); background: #fff; padding: 7px 9px; width: 100%;
}
textarea { min-height: 74px; resize: vertical; }
.btn, .ghost {
  font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  border: 3px solid var(--ink); padding: 6px 12px;
  background: var(--pink); color: var(--ink); box-shadow: 3px 3px 0 rgba(58, 36, 56, .28);
}
.btn:hover { background: var(--pink-2); }
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
.btn.mini { font-size: 11px; padding: 3px 8px; box-shadow: 2px 2px 0 rgba(58, 36, 56, .25); }
.btn.ok { background: var(--mint); }
.btn.bad { background: #ffd3d3; }
.btn.gold { background: var(--gold); }
.ghost { background: transparent; box-shadow: none; font-size: 11.5px; font-weight: 600; padding: 4px 8px; }
.ghost:hover { background: var(--pink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- 考试 ---------- */
.exam-card { border: 3px solid var(--ink); background: #fffdf2; padding: 12px; }
.exam-q { font-size: 15px; font-weight: 700; margin-bottom: 9px; }
.opts { display: grid; gap: 7px; }
.opt { text-align: left; font: inherit; font-size: 13.5px; background: #fff; border: 2px solid var(--ink); padding: 7px 9px; cursor: pointer; display: flex; gap: 8px; }
.opt:hover { background: var(--pink); }
.opt.on { background: var(--lav); }
.opt.right { background: #d6f5d6; border-color: #2e7d32; }
.opt.wrong { background: #ffdada; border-color: #b3261e; }
.opt .key { font-weight: 900; flex: none; }
.progress { height: 12px; border: 2px solid var(--ink); background: #fff; margin-bottom: 10px; }
.progress i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--pink-2) 0 6px, var(--pink-3) 6px 12px); }
.score { font-size: 26px; font-weight: 900; letter-spacing: 2px; }
.hist { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.hist .bar { width: 26px; text-align: center; font-size: 10px; border: 2px solid var(--ink); background: #fff; padding: 2px 0; }
.why { font-size: 12.5px; background: #f2ecff; border-left: 5px solid var(--lav); padding: 6px 8px; margin-top: 6px; }

/* ---------- 问教授 ---------- */
.quota { font-size: 12px; background: var(--lav); border: 2px solid var(--ink); padding: 3px 8px; display: inline-block; }
.chat-log { display: grid; gap: 10px; margin-top: 12px; }
.msg-stu { background: var(--pink); border: 3px solid var(--ink); padding: 7px 10px; font-size: 13.5px; margin-left: 22px; }
.msg-pro { background: #fff; border: 3px solid var(--ink); padding: 9px 11px; font-size: 13.5px; margin-right: 10px; box-shadow: 3px 3px 0 rgba(58, 36, 56, .16); }
.msg-pro .from { font-size: 11px; letter-spacing: 1px; color: #8a6280; margin-bottom: 4px; text-transform: uppercase; }
.msg-pro .ref { margin-top: 6px; }

/* ---------- 信件柜 ---------- */
.letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.letter-card { border: 3px solid var(--ink); background: #fff8e8; padding: 8px 9px; cursor: pointer; display: flex; gap: 8px; align-items: flex-start; }
.letter-card:hover { background: var(--pink); }
.letter-card .lt { font-size: 12.5px; font-weight: 700; }
.letter-empty-box { border: 3px dashed var(--pink-2); padding: 14px; text-align: center; font-size: 13px; color: #7d6076; }
.letter-body { font-size: 14px; white-space: pre-wrap; background: #fffdf5; border: 3px solid var(--wood-2); padding: 12px 14px; }

/* ---------- 模态 / toast / 安全提示 ---------- */
.modal { position: fixed; inset: 0; background: rgba(58, 36, 56, .55); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 18px; }
.modal.hide { display: none; }
.modal-card { max-width: 560px; width: 100%; background: var(--cream); border: 4px solid var(--ink); box-shadow: 8px 8px 0 rgba(0, 0, 0, .35); padding: 16px; max-height: 86vh; overflow: auto; }
.modal-card h3 { margin: 0 0 10px; font-size: 17px; }
.modal-actions { margin-top: 12px; text-align: right; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff7ea; border: 3px solid #fff; box-shadow: var(--shadow); padding: 8px 14px; font-size: 13px; z-index: 50; }
.toast.hide { display: none; }
.safety { font-size: 11.5px; color: #6d4a63; background: #fff3f7; border-left: 5px solid var(--pink-3); padding: 7px 9px; margin: 14px 0 0; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; font-size: 11px; color: #8a6280; flex-wrap: wrap; }
.hide { display: none !important; }
.empty { font-size: 13px; color: #7d6076; background: #fff; border: 2px dashed var(--pink-2); padding: 12px; }

/* ---------- 响应式 ---------- */
@media (max-width: 1080px) {
  .wrap { grid-template-columns: 1fr; }
  .topbar { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 10px; }
  .chips, .brand { justify-self: center; }
}
@media (max-width: 560px) {
  .books-row { gap: 0; min-height: 80px; padding: 0; }
  .book-btn { transform: scale(.74); transform-origin: bottom center; margin: 0 -5px; }
  .book-btn:hover, .book-btn.sel { transform: scale(.74) translateY(-8px); }
  .shelf { padding: 8px 6px 0; }
  .stage, .panel { padding: 12px 10px 14px; }
  .checkin .grid { grid-template-columns: 1fr; }
  .chip { min-width: 62px; }
  .wrap, .topbar { padding-left: 10px; padding-right: 10px; }
  .hat-hint { display: none; }
}
@media (max-width: 380px) {
  .book-btn { transform: scale(.62); margin: 0 -8px; }
  .book-btn:hover, .book-btn.sel { transform: scale(.62) translateY(-8px); }
  .books-row { min-height: 68px; }
}
@media (prefers-reduced-motion: reduce) {
  .cloud, .petal { animation: none; }
}

</style>
</head>
<body>
<div class="sky">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="petals" id="petals"></div>
</div>

<header class="topbar">
  <div class="brand">
    <h1 id="appTitle">心灵方块书屋</h1>
    <p id="appSub">MindCraft Library · 心理学家与十五本书</p>
  </div>

  <div class="prof" id="prof">
    <div class="prof-stack" id="profStack"></div>
    <div class="letter-drop" id="letterDrop" aria-hidden="true"></div>
    <p class="hat-hint" id="hatHint">点帽子：换语言 + 掉一封信</p>
  </div>

  <div class="chips" id="chips">
    <div class="chip"><span class="chip-k" id="kDate">今日</span><span class="chip-v" id="vDate">—</span></div>
    <div class="chip"><span class="chip-k" id="kAsk">提问剩余</span><span class="chip-v" id="vAsk">10</span></div>
    <div class="chip"><span class="chip-k" id="kExam">考试</span><span class="chip-v" id="vExam">—</span></div>
    <div class="chip"><span class="chip-k" id="kMood">今日心情</span><span class="chip-v" id="vMood">—</span></div>
    <div class="chip lang-chip"><span class="chip-v" id="vLang">中文</span></div>
  </div>
</header>

<main class="wrap">
  <section class="stage">
    <h2 class="sec-title" id="shelfTitle">书架</h2>
    <p class="sec-hint" id="shelfHint">点一本书来读</p>

    <div class="shelf">
      <div class="plank-label" id="label1"></div>
      <div class="books-row" id="row1"></div>
      <div class="board"></div>
      <div class="plank-label" id="label2"></div>
      <div class="books-row" id="row2"></div>
      <div class="board"></div>
      <div class="plank-label" id="label3"></div>
      <div class="books-row" id="row3"></div>
      <div class="board bottom"></div>
      <div class="legs"></div>
    </div>

    <div class="grass"></div>
  </section>

  <section class="panel">
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="book"><span class="ico" data-ico="star"></span><span id="tBook">书本</span></button>
      <button class="tab" data-tab="memory"><span class="ico" data-ico="check"></span><span id="tMemory">记忆清单</span></button>

<script>
/* ==== js/pixel.js ==== */
/* 像素渲染器：把字符网格画成方块精灵（Minecraft 风格）
 * 网格中每个字符 = 调色板键；'.' = 透明
 */
(function (global) {
  'use strict';

  function normalize(rows) {
    var cols = 0;
    for (var i = 0; i < rows.length; i++) cols = Math.max(cols, rows[i].length);
    return rows.map(function (r) {
      while (r.length < cols) r += '.';
      return r;
    });
  }

  function shadowGrid(rows, palette, scale) {
    var out = [];
    for (var y = 0; y < rows.length; y++) {
      var row = rows[y];
      for (var x = 0; x < row.length; x++) {
        var ch = row[x];
        if (ch === '.' || ch === ' ') continue;
        var color = palette[ch];
        if (!color) continue;
        out.push(x * scale + 'px ' + y * scale + 'px 0 0 ' + color);
      }
    }
    return out.join(',');
  }

  /**
   * 生成精灵元素
   * @param {string[]} rows 字符网格
   * @param {Object} palette 调色板
   * @param {number} scale 每个像素放大的px
   * @param {Object} extra 额外样式
   */
  function sprite(rows, palette, scale, extra) {
    var g = normalize(rows);
    var el = document.createElement('div');
    el.className = 'px-sprite';
    el.style.width = g[0].length * scale + 'px';
    el.style.height = g.length * scale + 'px';
    var dot = document.createElement('i');
    dot.style.width = scale + 'px';
    dot.style.height = scale + 'px';
    dot.style.boxShadow = shadowGrid(g, palette, scale);
    el.appendChild(dot);
    if (extra) Object.keys(extra).forEach(function (k) { el.style[k] = extra[k]; });
    return el;
  }

  /* ---------- 书本：竖立在书架上的精装书 ---------- */
  var BOOK_ROWS = [
    'ddddddddddddd.',
    'dccppppppppcd.',
    'dccppppppppcd.',
    'dsccppppppccd.',
    'dsccppppppccd.',
    'dccgggggggccd.',
    'dccgggggggccd.',
    'dccppppppppcd.',
    'dccppppppppcd.',
    'dccgggggpggcd.',
    'dccgggggpggcd.',
    'dsccppppppccd.',
    'dsccppppppccd.',
    'dccppppppppcd.',
    'dccppppppppcd.',
    'ddddddddddddd.'
  ];

  /** 生成书本精灵；scheme 决定封面/书脊/烫金颜色 */
  function bookSprite(scale, scheme, openMark) {
    var pal = {
      d: scheme.edge || '#2b1a12',
      c: scheme.cover,
      s: scheme.spine,
      p: scheme.pages || '#f6ead1',
      g: scheme.gold || '#f2c14e'
    };
    var rows = BOOK_ROWS.slice();
    if (openMark) {
      // 已读完：右下角贴一个像素对勾（替换最后两行局部字符）
      rows[12] = 'dsccppppppcdg.';
      rows[13] = 'dccpppppppcgg.';
      rows[14] = 'dccpppppppcdg.';
    }
    var el = sprite(rows, pal, scale, { position: 'relative' });
    el.dataset.book = '1';
    return el;
  }

  /* ---------- 人物：戴帽子的心理学教授 ---------- */
  var HAT_ROWS = [
    '.....hhhhhh.....',
    '....hhhhhhhh....',
    '...hhHHHHHHhh...',
    '...hhrrrrrrhh...',
    '.hhhhhhhhhhhhhh.',
    'hHHHHHHHHHHHHHHh',
    'HBBBBBBBBBBBBBBH',
    '................'
  ];

  var BODY_ROWS = [
    '................',
    '...FFFFFFFFFF...',
    '..FFFFFFFFFFFF..',
    '..FFffffffffFF..',
    '...FfeeFFeefF...',
    '...FffllffllF...',
    '....FfffmmF.....',
    '.....FFFFFF.....',
    '..kkkkkkkkkkkk..',
    '.kbbbbbbbbbbbbk.',
    '.kbbwwwwwwwwbbk.',
    '.kbwwPPPPPPwwbk.',
    '.kbwwP....Pwwbk.',
    '.kbwwPPPPPPwwbk.',
    '.kbbbbbbbbbbbbk.',
    '.kGGbbbbbbbbGGk.',
    'kkGGbbbbbbbbGGkk',
    '.kk..kkkk..kk...'
  ];

  var FACE_ANCHOR = { headRowTop: 1, hair: 'F', skin: 'f' };

  function personSprites(scale, theme) {
    var hatPal = { h: theme.hat, H: theme.hatDark, r: theme.ribbon, B: theme.hatBrim };
    var bodyPal = {
      F: theme.hair, f: theme.skin, e: theme.eye, P: theme.pocketDark, l: theme.blush || '#f0a0b0',
      m: theme.mouth, k: theme.outline, b: theme.dress, w: theme.apron, G: theme.hand
    };
    return {
      hat: sprite(HAT_ROWS, hatPal, scale, { cursor: 'pointer' }),
      body: sprite(BODY_ROWS, bodyPal, scale)
    };
  }

  /* ---------- 信封 ---------- */
  var LETTER_ROWS = [
    'eeeeeeeeeeeeee',
    'ewwwwwwwwwwwwt',
    'ewtttttttttwwt',
    'ewtTTTTTTTTwt.',
    'ewwwwwwwwwwwwt',
    'ewwwwRRRwwwwwt',
    'ewweewwwweewwt',
    'eweeewwweeeewt',
    'eeeeeeeeeeeeee'
  ];

  function letterSprite(scale, theme) {
    var pal = {
      e: theme.letterEdge || '#8a5a3c',
      w: theme.letterPaper || '#fff7e6',
      t: theme.letterShade || '#e6d2b3',
      T: theme.letterText || '#b79a72',
      R: theme.letterWax || '#e0567a'
    };
    return sprite(LETTER_ROWS, pal, scale);
  }

  /* ---------- 像素小图标（星星/心/书签/灯泡） ---------- */
  var ICONS = {
    star: ['......s.......', '.....sss......', '....sssss.....', 'ssssssssssssss', '.ssssssssssss.', '..ssssssssss..', '...sss.sss....', '...s.....s....'],
    heart: ['.hh....hh.', 'hhhhhhhhhh', 'hhhhhhhhhh', 'hhhhhhhhhh', '.hhhhhhhh.', '..hhhhhh..', '...hhhh...', '....hh....'],
    bulb: ['..yyyy..', 'yyyyyyyy', 'yyyyyyyy', 'yyyyyyyy', '.yyyyyy.', '..wwww..', '..wwww..', '...dd...'],
    check: ['..........', '.........g', '.......gg.', '.....gg...', '.gg.......', '..........']
  };

  function icon(name, scale, color) {
    var rows = ICONS[name] || ICONS.star;
    var pal = { w: '#c9c9c9', d: '#6b6b6b' };
    for (var i = 0; i < rows.length; i++) {
      for (var j = 0; j < rows[i].length; j++) {
        var c = rows[i][j];
        if (c !== '.' && !pal[c]) pal[c] = color;
      }
    }
    return sprite(rows, pal, scale);
  }

  global.Pixel = {
    sprite: sprite,
    book: bookSprite,
    person: personSprites,
    letter: letterSprite,
    icon: icon,
    HAT_ROWS: HAT_ROWS,
    BODY_ROWS: BODY_ROWS,
    FACE_ANCHOR: FACE_ANCHOR
  };
})(window);
</script>

  { id: 7, book: 'moodmap', q: { zh: '"低唤醒 + 不愉快"最像哪一种心情？', en: '“Low arousal plus unpleasant” most resembles which mood?' }, opts: [{ zh: '暴怒', en: 'Rage' }, { zh: '焦虑', en: 'Anxiety' }, { zh: '抑郁-沮丧', en: 'Depression-melancholy' }, { zh: '活力', en: 'Vigor' }], a: 2, why: { zh: '抑郁象限在环状模型的左下；焦虑与愤怒都在高唤醒一侧。', en: 'Depression sits lower-left on the circle; anxiety and anger are on the high-arousal side.' } },
  { id: 8, book: 'moodmap', q: { zh: 'Gross 情绪调节过程模型不包含哪个时机？', en: 'Which timing point is NOT in Gross’s process model?' }, opts: [{ zh: '情境选择', en: 'Situation selection' }, { zh: '认知改变', en: 'Cognitive change' }, { zh: '人格重塑', en: 'Personality restructuring' }, { zh: '反应调节', en: 'Response modulation' }], a: 2, why: { zh: '五个时机：情境选择、情境修改、注意分配、认知改变、反应调节。', en: 'The five are situation selection, situation modification, attention deployment, cognitive change, response modulation.' } },
  { id: 9, book: 'moodmap', q: { zh: '给情绪贴标签（affect labelling）为什么能降温？', en: 'Why does affect labelling cool an emotion?' }, opts: [{ zh: '它让情绪消失', en: 'It makes emotion disappear' }, { zh: '语言化会削弱杏仁核式的反应强度', en: 'Putting it into words dampens the amygdala-driven response' }, { zh: '它会转移注意', en: 'It only distracts you' }, { zh: '它增加唤醒', en: 'It raises arousal' }], a: 1, why: { zh: '命名激活前额语言区，与"说不清"状态相比强度下降。', en: 'Naming recruits verbal prefrontal regions; intensity drops compared with the unnameable state.' } },
  { id: 10, book: 'moodmap', q: { zh: '"持续低落两周以上且影响功能"应该怎么做？', en: 'Low mood lasting more than two weeks and harming function — what next?' }, opts: [{ zh: '再等等看', en: 'Wait and see' }, { zh: '靠意志力硬撑', en: 'Push through by willpower' }, { zh: '寻求专业评估与支持', en: 'Seek a professional assessment' }, { zh: '加大学习量分散注意', en: 'Study harder to distract' }], a: 2, why: { zh: '书屋是学习空间，不是治疗；两周规则是各国心理卫生机构通行的求助提示。', en: 'A study space is not therapy; the two-week rule is a common public-health prompt to seek help.' } },
  { id: 11, book: 'anxiety', q: { zh: '关于回避（avoidance），正确的说法是？', en: 'Which statement about avoidance is correct?' }, opts: [{ zh: '短期降焦虑，长期升焦虑', en: 'It lowers anxiety now and raises it later' }, { zh: '短期长期都有效', en: 'It works both short and long term' }, { zh: '它只是性格问题', en: 'It is merely personality' }, { zh: '它等同于休息', en: 'It is the same as rest' }], a: 0, why: { zh: '回避阻断"原来我可以"的经验，是暴露疗法的靶点。', en: 'Avoidance blocks the disconfirming experience; it is the target of exposure work.' } },
  { id: 12, book: 'anxiety', q: { zh: '5-4-3-2-1 接地技术主要从哪里入手？', en: 'The 5-4-3-2-1 grounding technique starts from where?' }, opts: [{ zh: '论证未来不会发生', en: 'Arguing the future will not happen' }, { zh: '感官：看到、摸到、听到、闻到、尝到', en: 'Senses: see, touch, hear, smell, taste' }, { zh: '回忆失败经历', en: 'Recalling failures' }, { zh: '计算概率', en: 'Computing probabilities' }], a: 1, why: { zh: '焦虑活在未来，感官只活在现在。', en: 'Anxiety lives in the future; the senses only live in the present.' } },
  { id: 13, book: 'anxiety', q: { zh: '呼吸调节中，什么比吸气更长才有效？', en: 'In breathing regulation, what should be longer than the inhale?' }, opts: [{ zh: '屏息', en: 'The hold' }, { zh: '呼气', en: 'The exhale' }, { zh: '吸气次数', en: 'Number of inhales' }, { zh: '大声数数', en: 'Counting aloud' }], a: 1, why: { zh: '延长呼气有助于副交感神经接手，是生理叹息与 4-7-8 的共同机制。', en: 'A longer exhale supports parasympathetic takeover — the shared mechanism of the physiological sigh and 4-7-8.' } },
  { id: 14, book: 'anxiety', q: { zh: '"担忧时间"的正确用法是？', en: 'The correct use of a worry window is?' }, opts: [{ zh: '随时开始担心 15 分钟', en: 'Worry 15 minutes whenever it strikes' }, { zh: '固定时段集中处理可解决的担忧，其余延后', en: 'A fixed slot for solvable worries; defer the rest' }, { zh: '禁止一切担忧', en: 'Forbid all worrying' }, { zh: '睡前大幅担忧帮助入睡', en: 'Heavy worrying before bed aids sleep' }], a: 1, why: { zh: '把担忧集中可控化；睡前只记录，不展开。', en: 'It contains worry in one place; before sleep you log it, you do not unfold it.' } },
  { id: 15, book: 'burnout', q: { zh: '教授如何区分"懒"与"倦怠"？', en: 'How does the professor separate laziness from burnout?' }, opts: [{ zh: '懒的人不难受，难受的人不是懒', en: 'The lazy do not ache; those who ache are not lazy' }, { zh: '看睡得多不多', en: 'By how much they sleep' }, { zh: '看成绩高低', en: 'By grades' }, { zh: '看是否玩手机', en: 'By phone use' }], a: 0, why: { zh: '倦怠伴随痛苦与无收获感，是收支失衡而非品行问题。', en: 'Burnout comes with pain and no sense of gain — a balance-sheet problem, not a character one.' } },
  { id: 16, book: 'burnout', q: { zh: '"恢复账户"两栏记的是什么？', en: 'The recovery diary’s two columns record what?' }, opts: [{ zh: '时间与地点', en: 'Time and place' }, { zh: '今天消耗了什么、补回了什么', en: 'What was spent, what was refunded' }, { zh: '对错与分数', en: 'Right and wrong, scores' }, { zh: '别人的评价', en: 'Others’ ratings' }], a: 1, why: { zh: '源自工作要求—资源模型：连续只有消耗就要强制安排补回。', en: 'From the demands–resources model: three spend-only days force a refund.' } },
  { id: 17, book: 'burnout', q: { zh: '塞涅卡那句话的重点是？', en: 'The point of the Seneca line is?' }, opts: [{ zh: '生命太短所以要及时行乐', en: 'Life is short so seek pleasure' }, { zh: '我们不是时间少，而是浪费多', en: 'We waste a lot of it rather than having little' }, { zh: '努力一定有回报', en: 'Effort always pays' }, { zh: '休息是罪', en: 'Rest is sin' }], a: 1, why: { zh: '斯多葛关心资源分配，不鼓励自我攻击。', en: 'Stoicism is about allocation, not self-attack.' } },
  { id: 18, book: 'burnout', q: { zh: '"最小可完成单元"为什么有效？', en: 'Why does the smallest completable unit work?' }, opts: [{ zh: '它降低了标准所以无所谓', en: 'Lowered standards do not matter' }, { zh: '它制造一次掌握性经验，喂养自我效能', en: 'It creates a mastery experience that feeds self-efficacy' }, { zh: '它能骗过老师', en: 'It fools the teacher' }, { zh: '它延长注意力时间', en: 'It lengthens attention span' }], a: 1, why: { zh: '打勾本身就是证据，动机跟在行动后面。', en: 'The tick is evidence; motivation follows action.' } },
  { id: 19, book: 'shame', q: { zh: '羞耻与愧疚的关键差别是？', en: 'The key difference between shame and guilt?' }, opts: [{ zh: '羞耻关于行为，愧疚关于自我', en: 'Shame is about behaviour, guilt about self' }, { zh: '羞耻说"我这个人不行"，愧疚说"这件事没做好"', en: 'Shame says “I am wrong”; guilt says “I did wrong”' }, { zh: '两者完全相同', en: 'They are identical' }, { zh: '愧疚更严重', en: 'Guilt is always worse' }], a: 1, why: { zh: '指向自我的评价最难行动；指向行为的评价可以修正。', en: 'Self-directed verdicts freeze action; behaviour-directed ones can be repaired.' } },
  { id: 20, book: 'shame', q: { zh: 'Neff 自我关怀三步骤不包括？', en: 'Which is NOT one of Neff’s three self-compassion steps?' }, opts: [{ zh: '正念承认痛苦', en: 'Mindfully acknowledging pain' }, { zh: '共通人性', en: 'Common humanity' }, { zh: '善待自己', en: 'Self-kindness' }, { zh: '与他人比较来激励自己', en: 'Comparing with others to motivate' }], a: 3, why: { zh: '比较恰好是羞耻的燃料。', en: 'Comparison is precisely shame’s fuel.' } },
  { id: 21, book: 'shame', q: { zh: '边界句式的三段顺序是？', en: 'The three parts of a boundary sentence, in order?' }, opts: [{ zh: '要求—事实—感受', en: 'Request, fact, feeling' }, { zh: '事实—感受—要求', en: 'Fact, feeling, request' }, { zh: '道歉—解释—保证', en: 'Apology, explanation, promise' }, { zh: '感受—指责—要求', en: 'Feeling, blame, request' }], a: 1, why: { zh: '先给可核查的事实，再给感受，最后给一个具体请求。', en: 'Checkable fact, then feeling, then one concrete request.' } },
  { id: 22, book: 'shame', q: { zh: '奥斯汀笔下"骄傲里常有怯懦"的读法是？', en: 'Austen’s “pride often hides diffidence” reads as?' }, opts: [{ zh: '骄傲是羞耻的盔甲', en: 'Pride is armour over shame' }, { zh: '骄傲等于自信', en: 'Pride equals confidence' }, { zh: '怯懦等于软弱', en: 'Diffidence is weakness' }, { zh: '两者无关', en: 'They are unrelated' }], a: 0, why: { zh: '被指出盔甲之后才有成长，这是人物弧线的心理机制。', en: 'Growth begins once the armour is named — the mechanism of a character arc.' } },
  { id: 23, book: 'meaning', q: { zh: '弗兰克尔把意义理解为？', en: 'Frankl treats meaning as?' }, opts: [{ zh: '生活向我提出的问题，需要我用行动回答', en: 'A question life asks, answered by action' }, { zh: '一种快乐感受', en: 'A pleasant feeling' }, { zh: '长期目标清单', en: 'A list of long goals' }, { zh: '宗教专属', en: 'Religion only' }], a: 0, why: { zh: '"重要的不是我们期待生活给什么，而是生活向我们期待什么。"', en: 'Not what we expect from life, but what life expects from us.' } },
  { id: 24, book: 'meaning', q: { zh: '"应当想象西西弗是幸福的"示范的是？', en: '“One must imagine Sisyphus happy” demonstrates?' }, opts: [{ zh: '否认痛苦', en: 'Denying pain' }, { zh: '在重复中把动作据为己有', en: 'Owning the gesture inside repetition' }, { zh: '追求成功', en: 'Pursuing success' }, { zh: '逃避责任', en: 'Escaping duty' }], a: 1, why: { zh: '意义不必来自新任务，可来自对同一任务的所有权。', en: 'Meaning can come from ownership of the same task rather than a new one.' } },
  { id: 25, book: 'meaning', q: { zh: '黑塞"鸟要出生必须先打碎一个世界"用于说明？', en: 'Hesse’s bird-and-egg line is used to show?' }, opts: [{ zh: '迷茫是外壳在裂，不是走错路', en: 'Being lost is the shell cracking, not the wrong road' }, { zh: '必须离开家庭', en: 'Leaving home is required' }, { zh: '成长等于暴力', en: 'Growth equals violence' }, { zh: '计划要严密', en: 'Plans must be tight' }], a: 0, why: { zh: '给"没有方向"重新归类为过渡状态。', en: 'Reclassifies directionlessness as a transition state.' } },
  { id: 26, book: 'procrastination', q: { zh: '关于拖延，研究共识认为它主要是？', en: 'The research consensus is that procrastination is mainly?' }, opts: [{ zh: '时间管理失败', en: 'A time-management failure' }, { zh: '情绪调节失败', en: 'An emotion-regulation failure' }, { zh: '智力问题', en: 'An intelligence issue' }, { zh: '睡眠不足', en: 'Sleep debt only' }], a: 1, why: { zh: '推迟的是"我可能做不好"的难受感，所以解法在情绪一侧。', en: 'What is postponed is the discomfort of possibly failing, so the fix sits on the emotion side.' } },
  { id: 27, book: 'procrastination', q: { zh: '班杜拉自我效能的四个来源不包括？', en: 'Which is NOT one of Bandura’s four sources of self-efficacy?' }, opts: [{ zh: '掌握性经验', en: 'Mastery experience' }, { zh: '替代经验', en: 'Modelling' }, { zh: '生理与情绪状态', en: 'Physiological and affective state' }, { zh: '运气归因', en: 'Luck attribution' }], a: 3, why: { zh: '第四项是言语说服（劝说）。', en: 'The fourth is verbal persuasion.' } },
  { id: 28, book: 'procrastination', q: { zh: 'if–then 实施意图的正确写法是？', en: 'A correct if–then implementation intention?' }, opts: [{ zh: '我要更努力', en: 'I will try harder' }, { zh: '如果晚饭后坐到书桌前，那么我先做一道题', en: 'If I sit at the desk after dinner, then I do one question' }, { zh: '明天开始认真学', en: 'Tomorrow I start being serious' }, { zh: '不要玩手机', en: 'Do not use the phone' }], a: 1, why: { zh: '需要具体线索 + 具体动作；否定式与模糊承诺无效。', en: 'It needs a concrete cue and a concrete act; vague or negative forms fail.' } },
  { id: 29, book: 'body', q: { zh: '睡眠卫生里，哪个时间更该固定？', en: 'In sleep hygiene, which time should be fixed?' }, opts: [{ zh: '入睡时间', en: 'Bedtime' }, { zh: '起床时间', en: 'Wake time' }, { zh: '午睡长度', en: 'Nap length' }, { zh: '晚饭时间', en: 'Dinner time' }], a: 1, why: { zh: '固定起床时间锚定生物钟；睡不着也要按时起。', en: 'A fixed wake time anchors the clock; you rise on time even after a bad night.' } },
  { id: 30, book: 'body', q: { zh: '"麦克白谋杀了睡眠"这句戏文说明？', en: '“Macbeth does murder sleep” shows?' }, opts: [{ zh: '失眠与愧疚互相喂养', en: 'Insomnia and guilt feeding each other' }, { zh: '睡眠是浪费时间的', en: 'Sleep is wasted time' }, { zh: ' Shakespeare 不懂医学', en: 'Shakespeare knew no medicine' }, { zh: '努力就能入睡', en: 'Effort brings sleep' }], a: 0, why: { zh: '睡眠是"受伤心智的香脂"，剥夺它会放大负性情绪。', en: 'Sleep is the balm of hurt minds; depriving it amplifies negative affect.' } },
  { id: 31, book: 'body', q: { zh: '对情绪最省力的运动剂量是？', en: 'The cheapest effective movement dose for mood?' }, opts: [{ zh: '每周一次两小时猛练', en: 'One two-hour session weekly' }, { zh: '每天三次十分钟快走', en: 'Three 10-minute walks a day' }, { zh: '只在体育课上动', en: 'Only in PE class' }, { zh: '完全休息', en: 'No movement at all' }], a: 1, why: { zh: '分次、可完成、可记录心情分数，形成自身证据。', en: 'Split, completable, and logged — it becomes your own evidence.' } },
  { id: 32, book: 'body', q: { zh: '疲劳迟钝时该安排什么任务？', en: 'In fatigue, which task should you schedule?' }, opts: [{ zh: '学习全新最难的内容', en: 'The newest, hardest material' }, { zh: '低认知任务：整理笔记、抄清单', en: 'Low-load work: tidy notes, copy lists' }, { zh: '当众演讲', en: 'Public speaking' }, { zh: '做一套限时模拟卷', en: 'A timed mock paper' }], a: 1, why: { zh: '疲劳时把高认知任务挪到活力象限，不要硬扛。', en: 'Move high-load work to the vigor quadrant instead of grinding.' } },
  { id: 33, book: 'clinic', q: { zh: '阅读疗法（bibliotherapy）三步顺序是？', en: 'The three steps of bibliotherapy, in order?' }, opts: [{ zh: '认同—净化—领悟', en: 'Identification, catharsis, insight' }, { zh: '背诵—默写—考试', en: 'Recite, dictation, exam' }, { zh: '批评—模仿—超越', en: 'Critique, imitate, surpass' }, { zh: '选书—买书—藏书', en: 'Choose, buy, collect' }], a: 0, why: { zh: '先认出相同的那一刻，再说出人物替你做了什么，最后转成明天的一条行动。', en: 'Find the shared moment, name what the character did for you, convert it into one action.' } },
  { id: 34, book: 'clinic', q: { zh: '哈姆雷特式的犹豫，教授开的药方是？', en: 'The professor’s prescription for Hamlet-style hesitation?' }, opts: [{ zh: '想得更多更久', en: 'Think longer' }, { zh: '给思考设时限，让"够好"决定', en: 'A deadline on thought; let good-enough decide' }, { zh: '找别人替我选', en: 'Let someone else choose' }, { zh: '推迟所有决定', en: 'Defer every decision' }], a: 1, why: { zh: '反刍的代价是行动减少；时限是反刍的止损。', en: 'Rumination costs action; a time limit stops the loss.' } },
  { id: 35, book: 'clinic', q: { zh: '斯嘉丽的"明天再想"为何既有效又昂贵？', en: 'Why is Scarlett’s “tomorrow” both effective and costly?' }, opts: [{ zh: '它完全无用', en: 'It is useless' }, { zh: '它推迟情绪，也推迟修复', en: 'It defers the feeling and the repair together' }, { zh: '它只会让人开心', en: 'It only brings joy' }, { zh: '它是最好的应对', en: 'It is the best coping' }], a: 1, why: { zh: '短期保护功能，长期欠账。', en: 'Short-term protection, long-term debt.' } },
  { id: 36, book: 'learning', q: { zh: '测试效应（testing effect）说明？', en: 'The testing effect tells us?' }, opts: [{ zh: '重复阅读比重写更有效', en: 'Re-reading beats writing' }, { zh: '自己回忆比重读更能巩固记忆', en: 'Recalling beats re-reading for retention' }, { zh: '考试只会增加焦虑', en: 'Tests only add anxiety' }, { zh: '朗读最有效', en: 'Reading aloud is strongest' }], a: 1, why: { zh: 'Roediger 与 Karpicke：提取本身改变记忆，而不是只测量记忆。', en: 'Roediger & Karpicke: retrieval changes memory, it does not merely measure it.' } },
  { id: 37, book: 'learning', q: { zh: '书屋记忆清单的间隔节奏是？', en: 'The memory list’s interval ladder?' }, opts: [{ zh: '1-2-4-7-15-30 天', en: '1-2-4-7-15-30 days' }, { zh: '每天一次，永不变', en: 'Every day, forever' }, { zh: '30 天一次', en: 'Once every 30 days' }, { zh: '完全随机', en: 'Entirely random' }], a: 0, why: { zh: '源自艾宾浩斯遗忘曲线的间隔重复思路；"忘了"会退回一级。', en: 'From the Ebbinghaus curve; a Lost tap steps the interval back one level.' } },
  { id: 38, book: 'learning', q: { zh: '"容易学会"的内容在考场上常怎样？', en: 'Material that felt easy to learn usually does what in the exam room?' }, opts: [{ zh: '记得最牢', en: 'Stays best' }, { zh: '最先消失', en: 'Goes first' }, { zh: '完全不受影响', en: 'Is unaffected' }, { zh: '变成程序性记忆', en: 'Becomes procedural' }], a: 1, why: { zh: '流畅性错觉（fluency illusion）：感觉良好不等于能提取。', en: 'The fluency illusion: feeling good is not being able to retrieve.' } },
  { id: 39, book: 'learning', q: { zh: '交错练习指的是？', en: 'Interleaving means?' }, opts: [{ zh: '一种题型连续刷到熟练', en: 'Blocking one question type to mastery' }, { zh: '把不同主题混在同一轮练习里', en: 'Mixing topics within one practice round' }, { zh: '交替使用不同颜色的笔', en: 'Alternating pen colours' }, { zh: '每天换一门学科', en: 'One subject per day' }], a: 1, why: { zh: '每日考试的 10 题跨书抽取，就是交错 + 提取的组合。', en: 'The daily ten are drawn across books — interleaving plus retrieval.' } },
  { id: 40, book: 'moodmap', q: { zh: '早上醒来心跳很快、想哭，最适合的第一件事？', en: 'Waking with a racing heart and tears — the best first move?' }, opts: [{ zh: '立刻复盘昨晚的争吵', en: 'Replay last night’s quarrel at once' }, { zh: '先处理身体：呼吸/冷水/走动，再决定要不要谈', en: 'Treat the body first: breathing, cold, walking — then decide whether to talk' }, { zh: '刷手机转移注意两小时', en: 'Scroll for two hours' }, { zh: '逼自己开始最难的任务', en: 'Force the hardest task' }], a: 1, why: { zh: '高唤醒状态先降温，低唤醒状态先行动——这是绿书地图的用法。', en: 'High arousal cools down first; low arousal acts first — how the green map is used.' } },
  { id: 41, book: 'anger', q: { zh: '"这句话三年后我还想让它成立吗"使用的技术是？', en: '“Do I want this sentence true of me in three years?” uses which technique?' }, opts: [{ zh: '时间距离化', en: 'Temporal distancing' }, { zh: '灾难化', en: 'Catastrophising' }, { zh: '正向肯定', en: 'Affirmation' }, { zh: '暴露疗法', en: 'Exposure' }], a: 0, why: { zh: '把自己放到未来的观察者位置，可自动降低愤怒强度。', en: 'Taking a future observer’s seat lowers anger intensity automatically.' } },
  { id: 42, book: 'shame', q: { zh: '"说出来一句，羞耻就少一半"依据是？', en: '“Say it aloud and shame halves” rests on?' }, opts: [{ zh: '羞耻依赖沉默与保密', en: 'Shame depends on silence and secrecy' }, { zh: '别人会笑话', en: 'Others will laugh' }, { zh: '语言会放大痛苦', en: 'Words amplify pain' }, { zh: '没有依据', en: 'It has no basis' }], a: 0, why: { zh: '把经验交给一个可信的人，羞耻的循环被打破；这也是表达性书写起效的原因。', en: 'Handing the experience to one trusted person breaks the loop — the same reason expressive writing works.' } },
  { id: 43, book: 'anxiety', q: { zh: '维特"无法坐着，非走动不可"在心理课上被用来讲解？', en: 'Werther’s restlessness is used in class to teach?' }, opts: [{ zh: '躯体性焦虑的表现', en: 'Somatic presentation of anxiety' }, { zh: '热爱运动', en: 'A love of sport' }, { zh: '抑郁的核心', en: 'The core of depression' }, { zh: '注意力缺陷', en: 'Attention deficit' }], a: 0, why: { zh: '坐立不安是焦虑的表现，不是性格缺陷；可加散步、书写与固定时段。', en: 'Restlessness is a symptom, not a flaw; add walking, writing and a fixed window.' } },
  { id: 44, book: 'burnout', q: { zh: '"休息是任务，不是奖励"的意思是？', en: '“Rest is a task, not a reward” means?' }, opts: [{ zh: '做完成绩才配休息', en: 'Rest must be earned by results' }, { zh: '休息要写进计划，像作业一样完成', en: 'Rest is scheduled and completed like homework' }, { zh: '不该休息', en: 'Do not rest' }, { zh: '休息等于偷懒', en: 'Rest is idleness' }], a: 1, why: { zh: '把恢复当成前置条件，而不是绩效之后的奖金。', en: 'Recovery is a precondition, not a bonus paid after performance.' } },
  { id: 45, book: 'wuli', q: { zh: '按教授的说法，"想家"最准确的解释是什么？', en: 'How does the professor best explain homesickness?' }, opts: [{ zh: '一种软弱', en: 'A weakness' }, { zh: '归属需要在说话', en: 'The need to belong speaking' }, { zh: '记忆出错', en: 'A memory error' }, { zh: '对父母的依赖', en: 'Dependence on parents' }], a: 1, why: { zh: '归属是人类基本动机之一（Baumeister & Leary, 1995）；给它命名比压住它更快。', en: 'Belonging is a basic human motive (Baumeister & Leary, 1995); naming it cools it faster than suppressing it.' } },
  { id: 46, book: 'wuli', q: { zh: '判断一个地方是"根"还是"笼子"，教授看的是什么？', en: 'Is a place a root or a cage — what does the professor look at?' }, opts: [{ zh: '能不能出去', en: 'Whether you can leave' }, { zh: '回来是不是自己选的', en: 'Whether coming back was your choice' }, { zh: '离家远近', en: 'How far it is' }, { zh: '别人怎么看', en: 'What others think' }], a: 1, why: { zh: '自主选择的归属满足自我决定理论的自主需要；被迫留下则不然。', en: 'Chosen belonging satisfies the autonomy need of self-determination theory; being held does not.' } },
  { id: 47, book: 'wuli', q: { zh: '"狗的陪法"指的是哪一种陪伴？', en: 'What is “the dog’s way” of accompanying?' }, opts: [{ zh: '给足建议', en: 'Plenty of advice' }, { zh: '只在场、不评价', en: 'Presence without judgement' }, { zh: '转移话题', en: 'Changing the subject' }, { zh: '比惨安慰', en: 'Comparing sufferings' }], a: 1, why: { zh: '来自 Rogers 的无条件积极关注；先坐到旁边，再说"我不太知道怎么办，我在这儿"。', en: 'From Rogers’ unconditional positive regard: sit down first, say “I don’t know what to do, I’m here.”' } },
  { id: 48, book: 'wuli', q: { zh: '归属落地练习"三样证据"不包含下面哪一项？', en: 'Which is NOT one of the three pieces of belonging evidence?' }, opts: [{ zh: '一个人', en: 'A person' }, { zh: '一处地方', en: 'A place' }, { zh: '一张成绩单', en: 'A report card' }, { zh: '一种味道', en: 'A taste' }], a: 2, why: { zh: '三样是人、地方、味道，都是感官与关系层面的；成绩不是归属的证据。', en: 'Person, place, taste — sensory and relational. Grades are not evidence of belonging.' } },
  { id: 49, book: 'living', q: { zh: '《活着》那句话在心理学上对应哪个概念？', en: 'Which psychological concept matches the line from To Live?' }, opts: [{ zh: '无条件自我接纳', en: 'Unconditional self-acceptance' }, { zh: '延迟满足', en: 'Delayed gratification' }, { zh: '正向错觉', en: 'Positive illusion' }, { zh: '习得性无助', en: 'Learned helplessness' }], a: 0, why: { zh: '"为活着本身而活"= 价值不需要用成就购买；这是 Ellis 的无条件自我接纳。', en: 'Living for its own sake means worth is not bought with achievement — Ellis’s unconditional self-acceptance.' } },
  { id: 50, book: 'living', q: { zh: '"别人更惨，所以我不能难过"错在哪里？', en: 'What is wrong with “others have it worse, so I may not grieve”?' }, opts: [{ zh: '它太宽容', en: 'It is too lenient' }, { zh: '它把哀伤办成比赛，是二次伤害', en: 'It turns grief into a contest — a second injury' }, { zh: '它忽略了别人', en: 'It ignores others' }, { zh: '它太理性', en: 'It is too rational' }], a: 1, why: { zh: '痛苦不可排名；比较只会让当事人把难过藏起来，延长哀伤。', en: 'Pain cannot be ranked; comparison only hides it and prolongs grief.' } },
  { id: 51, book: 'living', q: { zh: '教授为什么允许自己"把同一件难过的事讲很多遍"？', en: 'Why does the professor allow repeating the same sad story?' }, opts: [{ zh: '为了让别人同情', en: 'To gain sympathy' }, { zh: '讲述是在完成哀伤任务、把经历变成故事', en: 'Telling finishes the work of grief and turns events into story' }, { zh: '因为忘记更快', en: 'Because repetition erases' }, { zh: '因为写作更好', en: 'Because writing is better' }], a: 1, why: { zh: 'Worden 的哀伤四任务 + McAdams 的生活故事模型：重复讲述是心灵在做完工作。', en: 'Worden’s tasks of mourning plus McAdams’ life-story model: retelling is the mind completing a job.' } },
  { id: 52, book: 'living', q: { zh: '"四分钟讲述"的正确做法是？', en: 'What is the right way to do the “four-minute telling”?' }, opts: [{ zh: '四分钟只骂人', en: 'Four minutes of blame' }, { zh: '先只讲事实，再只讲感受，最后写一句"我还没说完的部分"', en: 'Facts first, then feeling, then “the part I have not said”' }, { zh: '一直讲到不哭', en: 'Until you stop crying' }, { zh: '写满三页交给别人', en: 'Three pages handed to someone' }], a: 1, why: { zh: '来自表达性写作（Pennebaker, 1986）：分段、限时、留未说完的部分，避免被情绪淹没。', en: 'From expressive writing (Pennebaker, 1986): staged, time-boxed, leaving an unsaid part so you are not flooded.' } },
  { id: 53, book: 'xusanguan', q: { zh: '"疼可以忍，羞辱不必接受"是在区分什么？', en: 'What does “bear the pain, refuse the shame” separate?' }, opts: [{ zh: '身体与心理', en: 'Body and mind' }, { zh: '行为价值与人格价值', en: 'What you do and what you are' }, { zh: '短期与长期', en: 'Short and long term' }, { zh: '自己与他人', en: 'Self and others' }], a: 1, why: { zh: '事情办砸不等于人格破产；把尊严与行为分开是自尊的稳定做法。', en: 'A failed act does not bankrupt the person; separating dignity from deed stabilises self-esteem.' } },
  { id: 54, book: 'xusanguan', q: { zh: '许玉兰被骂完之后反倒能吃饭了，教授用哪个概念解释？', en: 'Xu Yulan could eat again after being insulted — which concept fits?' }, opts: [{ zh: '污名与再纳入仪式', en: 'Stigma and a ritual of re-entry' }, { zh: '情绪压抑', en: 'Suppression' }, { zh: '习得性无助', en: 'Learned helplessness' }, { zh: '认知失调', en: 'Cognitive dissonance' }], a: 0, why: { zh: 'Goffman（1963）：被群体除名者需要先被象征性地重新接纳，才能回到日常。', en: 'Goffman (1963): the expelled need symbolic readmission before ordinary life resumes.' } },
  { id: 55, book: 'xusanguan', q: { zh: '"最难堪的事讲三遍，音量就变小"背后的机制是？', en: 'Which mechanism explains why a humiliating story shrinks after three tellings?' }, opts: [{ zh: '否认', en: 'Denial' }, { zh: '重复暴露带来的习惯化', en: 'Habituation through repeated exposure' }, { zh: '转移注意', en: 'Distraction' }, { zh: '合理化的解释', en: 'Rationalisation' }], a: 1, why: { zh: '民间说书的"三复"与治疗的重复暴露做的是同一件事：唤醒逐次下降。', en: 'The folk triple refrain and therapeutic repeated exposure do one thing: arousal drops each time.' } },
  { id: 56, book: 'xusanguan', q: { zh: '同学要你"帮一下又不会怎样"，教授的拒绝练法是什么？', en: 'A classmate says “it costs you nothing” — what is the drill?' }, opts: [{ zh: '先道歉再拒绝', en: 'Apologise, then refuse' }, { zh: '给一个长理由', en: 'Give a long reason' }, { zh: '说"这次不行"，重复同一句、不解释第二遍', en: 'Say “not this time”, repeat it unchanged, explain once only' }, { zh: '假装没听见', en: 'Pretend not to hear' }], a: 2, why: { zh: '自信训练：解释越多，对方越有可劝的把手；事后不必道歉。', en: 'Assertiveness training: every explanation is another handle to pull; no afterwards apology.' } },
  { id: 57, book: 'seventh', q: { zh: '教授对"想到死亡"的正式说法是？', en: 'What is the professor’s position on thoughts of death?' }, opts: [{ zh: '想到死就是有病', en: 'Such thoughts mean illness' }, { zh: '死亡焦虑是正常的，它常常在问"我怎样活"', en: 'Death anxiety is normal; it is usually asking how to live' }, { zh: '应该刻意不去想', en: 'Deliberately avoid them' }, { zh: '只有老年人才会有', en: 'Only the old have them' }], a: 1, why: { zh: '恐惧管理理论（Greenberg 等）：死亡提醒会收紧依附与价值感。', en: 'Terror-management theory (Greenberg et al.): mortality reminders tighten attachment and values.' } },
  { id: 58, book: 'seventh', q: { zh: '"护住人的不是好消息，是……"补全教授的话。', en: 'Complete: what shields us is not good news but…' }, opts: [{ zh: '更努力', en: 'Trying harder' }, { zh: '有人和我一起扛', en: 'Someone carrying it with me' }, { zh: '想得开', en: 'Thinking positively' }, { zh: '时间', en: 'Time' }], a: 1, why: { zh: '社会支持的缓冲假说（Cohen & Wills）：支持的作用在"共同承担"。', en: 'The buffering hypothesis (Cohen & Wills): support works by shared carrying.' } },
  { id: 59, book: 'seventh', q: { zh: '低心情保护单里不包含下面哪一项？', en: 'Which is NOT on the low-mood safety card?' }, opts: [{ zh: '三件让自己稳一点的小事', en: 'Three small steadying things' }, { zh: '一个可以说话的人', en: 'One person to talk to' }, { zh: '12356 与两周规则', en: '12356 and the two-week rule' }, { zh: '今天的考试分数', en: 'Today’s quiz score' }], a: 3, why: { zh: '保护单只放稳态、人与求助路径；分数与求助无关。', en: 'The card holds steadying actions, one person, and the routes for help — never a score.' } },
  { id: 60, book: 'seventh', q: { zh: '关于哀伤的"五阶段"，教授的正确提醒是？', en: 'What is the professor’s correct caution about the five stages?' }, opts: [{ zh: '人人必须按顺序走完', en: 'Everyone must go in order' }, { zh: '有阶段感，但没有时间表，不能用来催谁', en: 'A shape but no timetable — never used to hurry anyone' }, { zh: '走到接受就算治好', en: 'Acceptance means cured' }, { zh: '只适用于临终', en: 'Only for the dying' }], a: 1, why: { zh: '库伯勒-罗丝本人后来也强调阶段并非关卡；用它催促会造成二次压力。', en: 'Kübler-Ross herself stressed the stages are not checkpoints; using them to hurry someone adds pressure.' } },
  { id: 61, book: 'maupassant', q: { zh: '《项链》里玛蒂尔德赔掉十年，教授指向哪个心理机制？', en: 'Which mechanism does the ten-year loss in “The Necklace” point to?' }, opts: [{ zh: '社会比较（Festinger）', en: 'Social comparison (Festinger)' }, { zh: '习得性无助', en: 'Learned helplessness' }, { zh: '确认偏误', en: 'Confirmation bias' }, { zh: '旁观者效应', en: 'Bystander effect' }], a: 0, why: { zh: '为了不被比下去而借项链；比较本身不丢人，要查的是"我在和谁的哪个版本比"。', en: 'The borrowed necklace was to avoid being outshone. Comparison is normal; audit which version of whom you compare with.' } },
  { id: 62, book: 'maupassant', q: { zh: '"比较审计"的第一步是什么？', en: 'What is the first step of the comparison audit?' }, opts: [{ zh: '删掉所有社交软件', en: 'Delete every app' }, { zh: '写下我在和谁的哪一面比：他的成品还是他的日常', en: 'Write whose which: their highlight or their ordinary day' }, { zh: '买一样的东西', en: 'Buy the same thing' }, { zh: '告诉自己不比了', en: 'Tell yourself to stop' }], a: 1, why: { zh: '先分辨"成品 vs 日常"，再谈要不要、要哪一样、代价多少。', en: 'Separate highlight from daily life first; only then decide what you want and at what price.' } },
  { id: 63, book: 'maupassant', q: { zh: '《我的叔叔于勒》里全家态度反转，说明他们给的是哪种爱？', en: 'The family’s reversal over Uncle Jules shows which kind of regard?' }, opts: [{ zh: '条件性接纳', en: 'Conditional regard' }, { zh: '无条件积极关注', en: 'Unconditional positive regard' }, { zh: '权威式管教', en: 'Authoritarian control' }, { zh: '安全依附', en: 'Secure attachment' }], a: 0, why: { zh: '被爱的是用处，不是人。练习：找一个从不问成绩的人待二十分钟。', en: 'Usefulness was loved, not the person. Drill: twenty minutes with someone who never asks your grades.' } },
  { id: 64, book: 'maupassant', q: { zh: '"期待校正表"要求右栏"现在我看到"只写什么？', en: 'In the expectation-correction table, the “now I see” column may contain only…' }, opts: [{ zh: '对人格的评价', en: 'Judgements of character' }, { zh: '具体行为', en: 'Concrete behaviour' }, { zh: '未来的保证', en: 'Future promises' }, { zh: '情绪形容词', en: 'Feeling words' }], a: 1, why: { zh: '"他就是这种人"会让失望变成永久判决；只写行为，属于认知重评。', en: '“That is just how he is” turns disappointment into a permanent verdict; behaviours only — cognitive reappraisal.' } }
];

          btn.appendChild(window.Pixel.book(5, b.skin, !!st.read[b.id]));

          }

  }

  function selectBook(id) {
    selectedBook = bookById(id);
    switchTab('book');
    buildShelf();
    renderBook();
    el.panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---------------- Tab 切换 ---------------- */
  var currentTab = 'book';
  function switchTab(name) {
    currentTab = name;
    Array.prototype.forEach.call(el.tabs.querySelectorAll('.tab'), function (b) {
      b.classList.toggle('active', b.dataset.tab === name);
    });
    ['book', 'memory', 'exam', 'ask', 'letters'].forEach(function (k) {
      el['tab' + cap(k)].classList.toggle('hide', k !== name);
    });
    renderTab(name);
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function renderTab(name) {
    if (name === 'book') renderBook();
    if (name === 'memory') renderMemory();
    if (name === 'exam') renderExam();
    if (name === 'ask') renderAsk();
    if (name === 'letters') renderLetters();
  }
  function renderAll() {
    buildShelf();
    ['book', 'memory', 'exam', 'ask', 'letters'].forEach(renderTab);
    updateChips();
  }

  /* ---------------- 书本内容渲染 ---------------- */
  function renderBook() {
    var host = el.tabBook;
    clear(host);
    if (!selectedBook) {
      var e = mk('div', 'empty', t('shelfHint'));
      host.appendChild(e);
      var go = mk('button', 'ghost', t('navIntro'));
      go.addEventListener('click', showIntro);
      host.appendChild(go);
      return;
    }
    var b = selectedBook;

    var head = mk('div', 'book-head');
    var sw = mk('div', 'swatch'); sw.style.background = b.skin.cover; head.appendChild(sw);
    var meta = mk('div');
    var h3 = mk('h3', null, L(b.colorName) + ' · ' + L(b.title));
    var sub = mk('p', 'sub', L(b.subtitle));
    var tag = mk('span', 'tagline', L(b.mood));
    meta.appendChild(h3); meta.appendChild(sub); meta.appendChild(tag);
    head.appendChild(meta);
    var mark = mk('button', 'btn mini read-toggle' + (st.read[b.id] ? ' gold' : ''));
    mark.textContent = st.read[b.id] ? ('✓ ' + t('readTag')) : t('markRead');
    mark.addEventListener('click', function () {
      if (st.read[b.id]) delete st.read[b.id]; else st.read[b.id] = true;
      save(); buildShelf(); renderBook();
    });
    head.appendChild(mark);
    host.appendChild(head);

    host.appendChild(mk('p', 'narr', L(b.intro)));

    if (b.moodMapIntro) {
      var blk0 = mk('div', 'blk');

      host.appendChild(blk0);
    }

    if (b.relief && b.relief.length) addSentBlock(host, t('sectionRelief'), b.relief, b);
    if (b.literature && b.literature.length) addQuoteBlock(host, t('sectionLiterature'), b.literature, b);
    if (b.cases && b.cases.length) addCaseBlock(host, t('sectionCases'), b.cases, b);
    if (b.groups && b.groups.length) addMoodBlocks(host, b);
    if (b.methods && b.methods.length) addMethodBlock(host, t('sectionMethods'), b.methods, b);
    if (b.memory && b.memory.length) addSeedBlock(host, t('sectionMemory'), b.memory, b);
  }

  function inList(text) {
    return st.memory.some(function (m) { return m.text.zh === text.zh || m.text.en === text.en; });
  }

  function addBtn(text, b) {

    btn.addEventListener('click', function () {
      if (inList(text)) { toast(st.lang === 'zh' ? '已经在清单里了' : 'Already in the list'); return; }
      st.memory.push({ id: 'm' + Date.now() + Math.floor(Math.random() * 999), text: text, book: b.id, box: 0, due: today(), okCount: 0, missCount: 0 });

      toast(t('memoryTitle') + ' +1');

  /* ---------------- 心情地图 + 签到 ---------------- */
  function addMoodBlocks(host, b) {

      var card = mk('div', 'mood-card');
      var mh = mk('div', 'mh');
      mh.appendChild(mk('span', 'poms', g.poms));
      mh.appendChild(mk('span', null, L(g.name)));
      var link = mk('button', 'ghost', '▸ ' + L(bookById(g.book).title));
      link.addEventListener('click', function () { selectBook(g.book); });
      mh.appendChild(link);
      card.appendChild(mh);
      card.appendChild(mk('div', 'fit', t('classifyResult') + ': ' + L(g.quadrant)));
      card.appendChild(mk('div', 'sign', (st.lang === 'zh' ? '表现：' : 'Looks like: ') + L(g.sign)));
      var ul = document.createElement('ul');
      g.method.forEach(function (m) { ul.appendChild(mk('li', null, L(m))); });
      card.appendChild(ul);

  function buildCheckin(host, b) {
    var blk = mk('div', 'blk');
    blk.appendChild(mk('h4', null, t('sectionCheckin')));
    var box = mk('div', 'checkin');
    var grid = mk('div', 'grid');

    var lm = mk('div');
    var l1 = mk('label', null, t('valence')); l1.htmlFor = 'val';
    var r1 = document.createElement('input'); r1.type = 'range'; r1.min = '1'; r1.max = '5'; r1.value = '3'; r1.id = 'val';
    lm.appendChild(l1); lm.appendChild(r1);
    lm.appendChild(mk('div', 'note', t('valLow') + ' ← → ' + t('valHigh')));
    grid.appendChild(lm);

    var rm = mk('div');
    var l2 = mk('label', null, t('arousal')); l2.htmlFor = 'aro';
    var r2 = document.createElement('input'); r2.type = 'range'; r2.min = '1'; r2.max = '5'; r2.value = '3'; r2.id = 'aro';
    rm.appendChild(l2); rm.appendChild(r2);
    rm.appendChild(mk('div', 'note', t('aroLow') + ' ← → ' + t('aroHigh')));
    grid.appendChild(rm);
    box.appendChild(grid);

    var picks = mk('div', 'picks');
    var chosen = { group: null };
    b.groups.forEach(function (g) {
      var p = mk('button', 'pick', L(g.name));
      p.type = 'button';
      p.addEventListener('click', function () {
        chosen.group = g.key;
        Array.prototype.forEach.call(picks.children, function (c) { c.classList.remove('on'); });
        p.classList.add('on');
      });
      picks.appendChild(p);
    });
    box.appendChild(picks);

    var btn = mk('button', 'btn ok', t('classify'));
    var out = mk('div', 'result hide');
    btn.addEventListener('click', function () {
      if (!chosen.group) { toast(st.lang === 'zh' ? '先在六个维度里选一个' : 'Pick one of the six factors first'); return; }
      var v = +r1.value, a = +r2.value;
      var quad = quadrantText(v, a);
      var g = null;
      for (var i = 0; i < b.groups.length; i++) if (b.groups[i].key === chosen.group) g = b.groups[i];
      clear(out);
      out.appendChild(mk('b', null, t('classifyResult') + '：' + L(g.name) + '（' + g.poms + '）'));
      out.appendChild(mk('div', null, t('valence') + '×' + t('arousal') + ' = ' + v + '×' + a + ' → ' + quad));
      out.appendChild(mk('div', null, (st.lang === 'zh' ? '适用场景：' : 'Fits: ') + L(g.scene)));
      out.appendChild(mk('div', null, (st.lang === 'zh' ? '调节时机：' : 'Timing: ') + L(g.fitStage)));
      out.appendChild(mk('div', null, t('relatedBook') + '：' + L(bookById(g.book).title)));
      var rule = a >= 4
        ? (st.lang === 'zh' ? '高唤醒 → 先降温：呼吸/冷水/走动，再谈事情。' : 'High arousal → cool down first: breathing, cold, walking.')
        : (a <= 2 ? (st.lang === 'zh' ? '低唤醒 → 先行动：一件五分钟能完成的小事。' : 'Low arousal → act first: one five-minute completable thing.')
          : (st.lang === 'zh' ? '中等唤醒 → 先命名：写一行事实、一行感受、一行要求。' : 'Mid arousal → name it first: one line of fact, feeling, request.'));
      out.appendChild(mk('div', null, '★ ' + rule));
      st.moods = st.moods.filter(function (m) { return m.date !== today(); });
      st.moods.push({ date: today(), val: v, aro: a, group: chosen.group });
      save(); updateChips();
      out.classList.remove('hide');
      toast(t('moodLogged'));
    });
    box.appendChild(btn);
    box.appendChild(out);

    var last = st.moods[st.moods.length - 1];
    if (last) {
      var hist = mk('div', 'note');
      hist.textContent = (st.lang === 'zh' ? '最近记录：' : 'Recent: ') + st.moods.slice(-7).map(function (m) {
        return m.date.slice(5) + ' ' + groupName(m.group);
      }).join(' ｜ ');
      box.appendChild(hist);
    }
    blk.appendChild(box);
    host.appendChild(blk);
  }

  function quadrantText(v, a) {
    var vp = v >= 4 ? (st.lang === 'zh' ? '愉快' : 'pleasant') : (v <= 2 ? (st.lang === 'zh' ? '不愉快' : 'unpleasant') : (st.lang === 'zh' ? '偏中性' : 'neutral'));
    var ap = a >= 4 ? (st.lang === 'zh' ? '高唤醒' : 'high arousal') : (a <= 2 ? (st.lang === 'zh' ? '低唤醒' : 'low arousal') : (st.lang === 'zh' ? '中唤醒' : 'mid arousal'));
    return vp + ' × ' + ap;
  }

  /* ---------------- 记忆清单 ---------------- */
  function renderMemory() {
    var host = el.tabMemory;
    clear(host);
    var head = mk('div', 'list-head');
    head.appendChild(mk('h3', null, t('memoryTitle')));
    var dueList = st.memory.filter(function (m) { return m.due <= today(); });
    var c1 = mk('span', 'count', t('memoryDue') + ' ' + dueList.length);
    var c2 = mk('span', 'count', t('memoryAll') + ' ' + st.memory.length);
    head.appendChild(c1); head.appendChild(c2);
    var f = mk('button', 'ghost', (memFilter === 'due' ? '★ ' : '') + t('memoryDue') + ' / ' + (memFilter === 'all' ? '★ ' : '') + t('memoryAll'));
    f.addEventListener('click', function () { memFilter = memFilter === 'due' ? 'all' : 'due'; renderMemory(); });
    head.appendChild(f);
    host.appendChild(head);
    host.appendChild(mk('p', 'sec-hint', t('memorySub')));

    var row = mk('div', 'add-row');
    var inp = document.createElement('input');
    inp.type = 'text'; inp.placeholder = t('memoryPh');
    var btn = mk('button', 'btn', t('memoryBtn'));
    function push() {
      var v = inp.value.trim();
      if (!v) { toast(t('askEmpty')); return; }
      st.memory.push({ id: 'm' + Date.now(), text: { zh: v, en: v }, book: selectedBook ? selectedBook.id : 'learning', box: 0, due: today(), okCount: 0, missCount: 0 });
      inp.value = ''; save(); renderAll(); toast('+1');
    }
    btn.addEventListener('click', push);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') push(); });
    row.appendChild(inp); row.appendChild(btn);
    host.appendChild(row);

    var list = (memFilter === 'due') ? dueList : st.memory;
    if (!list.length) { host.appendChild(mk('div', 'empty', t('memoryEmpty'))); return; }
    list.forEach(function (m) {
      var card = mk('div', 'mem-item' + (m.due <= today() ? ' due' : ''));
      card.appendChild(mk('div', 'txt', L(m.text)));
      var meta = mk('div', 'meta');
      var bk = bookById(m.book);
      meta.appendChild(mk('span', null, '▤ ' + (bk ? L(bk.title) : m.book)));
      meta.appendChild(mk('span', null, t('nextReview') + ': ' + (m.due <= today() ? t('todayReview') : m.due)));
      meta.appendChild(mk('span', null, (st.lang === 'zh' ? '第 ' : 'box ') + (m.box + 1) + (st.lang === 'zh' ? ' 格' : '')));
      meta.appendChild(mk('span', null, '✓ ' + m.okCount + ' ✗ ' + m.missCount));
      card.appendChild(meta);
      var acts = mk('div', 'acts');
      var ok = mk('button', 'btn mini ok', t('remember'));
      ok.addEventListener('click', function () {
        m.box = Math.min(m.box + 1, INTERVALS.length - 1);
        m.due = shiftDate(INTERVALS[m.box]);
        m.okCount++; save(); renderAll();
      });
      var no = mk('button', 'btn mini bad', t('forgot'));
      no.addEventListener('click', function () {
        m.box = Math.max(0, m.box - 1);
        m.due = today();
        m.missCount++; save(); renderAll();
      });
      var del = mk('button', 'ghost', t('deleteItem'));
      del.addEventListener('click', function () {
        st.memory = st.memory.filter(function (x) { return x.id !== m.id; });
        save(); renderAll();
      });
      acts.appendChild(ok); acts.appendChild(no); acts.appendChild(del);
      if (bk) {
        var jump = mk('button', 'ghost', '▸ ' + L(bk.title));
        jump.addEventListener('click', function () { selectBook(bk.id); });
        acts.appendChild(jump);
      }
      card.appendChild(acts);
      host.appendChild(card);
    });
  }

  /* ---------------- 每日考试 ---------------- */
  function todayExamRecord() {
    for (var i = 0; i < st.exams.length; i++) if (st.exams[i].date === today()) return st.exams[i];
    return null;
  }

  function renderExam() {
    var host = el.tabExam;
    clear(host);
    host.appendChild(mk('h3', null, t('examTitle')));
    host.appendChild(mk('p', 'sec-hint', t('examSub')));

    if (examSession) { renderExamFlow(host); return; }
    var rec = todayExamRecord();
    if (rec) {
      var box = mk('div', 'exam-card');
      box.appendChild(mk('div', 'score', t('examScore') + ' ' + rec.score + ' / ' + rec.total));
      box.appendChild(mk('div', 'why', (st.lang === 'zh' ? '今日成绩已记录。错题的那一句，记得加进记忆清单。' : 'Today’s score is saved. Put the wrong-answer lines into the memory list.')));
      box.appendChild(mk('p', 'sec-hint', t('examAgain')));
      var again = mk('button', 'btn', t('examAgain'));
      again.addEventListener('click', function () { startExam(true); });
      box.appendChild(again);
      host.appendChild(box);
    } else {
      var b2 = mk('div', 'exam-card');
      b2.appendChild(mk('div', 'why', (st.lang === 'zh' ? '今天的 10 题还没开始。跨全部书目随机抽取：它同时是提取练习与交错练习。' : 'Today’s ten are waiting, drawn across every book — retrieval practice and interleaving at once.')));
      var go = mk('button', 'btn gold', t('examStart'));
      go.addEventListener('click', function () { startExam(false); });
      b2.appendChild(go);
      host.appendChild(b2);
    }
    renderHistory(host);
  }

  function renderHistory(host) {
    var last = st.exams.slice(-7);
    host.appendChild(mk('p', 'sec-hint', t('examRecord')));
    if (!last.length) { host.appendChild(mk('div', 'empty', t('examNoRecord'))); return; }
    var h = mk('div', 'hist');
    last.forEach(function (r) {
      var day = mk('div', 'bar', r.date.slice(5));
      day.style.background = '#fff';
      var b = mk('div', 'bar', r.score + '/' + r.total);
      b.title = r.date;
      b.style.background = r.score >= 8 ? '#d6f5d6' : (r.score >= 6 ? '#fff3cd' : '#ffdada');
      h.appendChild(day);
      h.appendChild(b);
    });
    host.appendChild(h);
  }

  function startExam(practice) {
    examSession = { ids: shuffled(window.EXAM_BANK, EXAM_SIZE).map(function (q) { return q.id; }), i: 0, picks: [], practice: !!practice, result: null };
    renderExam();
  }

  function qById(id) {
    for (var i = 0; i < window.EXAM_BANK.length; i++) if (window.EXAM_BANK[i].id === id) return window.EXAM_BANK[i];
    return null;
  }

  function renderExamFlow(host) {
    var s = examSession;
    if (s.result) { renderResult(host); return; }
    var q = qById(s.ids[s.i]);
    var card = mk('div', 'exam-card');
    var prog = mk('div', 'progress');
    var bar = mk('i'); bar.style.width = ((s.i) / s.ids.length * 100) + '%';
    prog.appendChild(bar); card.appendChild(prog);
    card.appendChild(mk('div', 'sec-hint', t('examQ').replace('{a}', s.i + 1).replace('{b}', s.ids.length)));
    card.appendChild(mk('div', 'exam-q', L(q.q)));
    var bk = bookById(q.book);
    card.appendChild(mk('div', 'sec-hint', '▤ ' + (bk ? L(bk.title) : '')));
    var opts = mk('div', 'opts');
    var KEYS = ['A', 'B', 'C', 'D'];
    q.opts.forEach(function (o, idx) {
      var b = mk('button', 'opt' + (s.picks[s.i] === idx ? ' on' : ''));
      b.type = 'button';
      b.appendChild(mk('span', 'key', KEYS[idx]));
      b.appendChild(mk('span', null, L(o)));
      b.addEventListener('click', function () { s.picks[s.i] = idx; renderExam(); });
      opts.appendChild(b);
    });
    card.appendChild(opts);
    var row = mk('div', 'acts');
    row.style.cssText = 'display:flex;gap:8px;margin-top:12px;flex-wrap:wrap';
    if (s.i > 0) {
      var prev = mk('button', 'ghost', '←');
      prev.addEventListener('click', function () { s.i--; renderExam(); });
      row.appendChild(prev);
    }
    if (s.picks[s.i] === undefined) {
      var skip = mk('button', 'ghost', (st.lang === 'zh' ? '跳过' : 'Skip'));
      skip.addEventListener('click', function () { s.picks[s.i] = -1; nextQ(); });
      row.appendChild(skip);
    }
    var nxt = mk('button', 'btn', s.i === s.ids.length - 1 ? t('examSubmit') : t('examNext'));
    nxt.addEventListener('click', nextQ);
    row.appendChild(nxt);
    card.appendChild(row);
    host.appendChild(card);
  }

  function nextQ() {
    var s = examSession;
    if (s.i < s.ids.length - 1) { s.i++; renderExam(); return; }
    var right = 0, wrongLines = [];
    s.ids.forEach(function (id, k) {
      var q = qById(id);
      if (s.picks[k] === q.a) right++;
      else wrongLines.push(q);
    });
    s.result = { right: right, wrongLines: wrongLines };
    if (!s.practice) {
      st.exams = st.exams.filter(function (r) { return r.date !== today(); });
      st.exams.push({ date: today(), score: right, total: s.ids.length, ts: Date.now() });
      save(); updateChips();
    }
    renderExam();
  }

  function renderResult(host) {
    var s = examSession, r = s.result;
    var card = mk('div', 'exam-card');
    card.appendChild(mk('div', 'score', t('examScore') + ' ' + r.right + ' / ' + s.ids.length));
    if (s.practice) card.appendChild(mk('div', 'sec-hint', '· ' + t('examAgain')));
    card.appendChild(mk('h4', null, t('examReviewTitle')));
    s.ids.forEach(function (id, k) {
      var q = qById(id);
      var pick = s.picks[k];
      var one = mk('div', 'quote');
      one.style.borderLeftColor = q.a === pick ? '#2e7d32' : '#b3261e';
      one.appendChild(mk('div', 'q', (k + 1) + '. ' + L(q.q)));
      var ul = mk('div', 'show');
      q.opts.forEach(function (o, oi) {
        var line = mk('div', null, (oi === q.a ? '✓ ' : '   ') + L(o) + (oi === pick && oi !== q.a ? '  ✗' : ''));
        line.style.fontFamily = 'var(--mono)';
        line.style.whiteSpace = 'pre-wrap';
        ul.appendChild(line);
      });
      one.appendChild(ul);
      one.appendChild(mk('div', 'why', (pick === q.a ? t('correct') + ' — ' : t('wrong') + ' · ' + t('answerIs') + ' ' + 'ABCD'.charAt(q.a) + ' — ') + L(q.why)));
      var row = mk('div', 'row');
      row.style.cssText = 'display:flex;justify-content:flex-end;margin-top:6px';
      var bk = bookById(q.book);
      if (bk && pick !== q.a) {
        var jump = mk('button', 'ghost', '▸ ' + L(bk.title));
        jump.addEventListener('click', function () { selectBook(bk.id); });
        row.appendChild(jump);
      }
      if (pick !== q.a) row.appendChild(addBtn({ zh: L(q.q) + ' → ' + L(q.why), en: L(q.q) + ' → ' + L(q.why) }, bk || bookById('learning')));
      one.appendChild(row);
      card.appendChild(one);
    });
    var again = mk('button', 'btn', t('examAgain'));
    again.addEventListener('click', function () { startExam(true); });
    var close = mk('button', 'ghost', '×');
    close.addEventListener('click', function () { examSession = null; renderExam(); });
    card.appendChild(again); card.appendChild(close);
    host.appendChild(card);
    renderHistory(host);
  }

  /* ---------------- 问教授 ---------------- */
  function askUsed() { return (st.quota.date === today()) ? st.quota.used : 0; }

  function renderAsk() {
    var host = el.tabAsk;
    clear(host);
    host.appendChild(mk('h3', null, t('askTitle')));
    host.appendChild(mk('p', 'sec-hint', t('askSub')));
    var left = DAILY_ASK_LIMIT - askUsed();
    var q = mk('div', 'quota', left > 0 ? t('askQuota').replace('{n}', left) : t('askQuotaZero'));
    host.appendChild(q);

    var area = document.createElement('textarea');
    area.placeholder = t('askPh');
    var send = mk('button', 'btn gold', t('askBtn'));
    send.disabled = left <= 0;
    area.disabled = left <= 0;
    function sendIt() {
      var text = area.value.trim();
      if (!text) { toast(t('askEmpty')); return; }
      if (askUsed() >= DAILY_ASK_LIMIT) { toast(t('askQuotaZero')); return; }
      if (st.quota.date !== today()) st.quota = { date: today(), used: 0 };
      st.quota.used++;
      var ans = matchAnswer(text);
      var stamp = Date.now();
      st.chats.push({ q: text, a: ans.pair, book: ans.book, date: today(), ts: stamp });
      st.chats = st.chats.slice(-40);
      area.value = '';
      save(); renderAll();
    }
    send.addEventListener('click', sendIt);
    host.appendChild(area);
    host.appendChild(send);

    var log = mk('div', 'chat-log');
    var mine = st.chats.slice().reverse();
    if (!mine.length) host.appendChild(mk('div', 'empty', (st.lang === 'zh' ? '还没有问过。把今天的处境写成一句话。' : 'Nothing asked yet. Write today’s situation as one sentence.')));
    mine.forEach(function (c) {
      log.appendChild(mk('div', 'msg-stu', (st.lang === 'zh' ? '学生：' : 'Student: ') + c.q + '（' + c.date + '）'));
      var p = mk('div', 'msg-pro');
      p.appendChild(mk('div', 'from', t('askFrom')));
      p.appendChild(mk('div', null, typeof c.a === 'string' ? c.a : L(c.a)));
      var bk = bookById(c.book);
      if (bk) {
        var ref = mk('div', 'ref');
        var jump = mk('button', 'ghost', '▸ ' + L(bk.title));
        jump.addEventListener('click', function () { selectBook(bk.id); });
        ref.appendChild(jump);
        p.appendChild(ref);
      }
      log.appendChild(p);
    });
    host.appendChild(log);
  }

  function matchAnswer(text) {
    var s = text.toLowerCase();
    var best = null, bestHits = 0;
    window.PROFESSOR.forEach(function (item) {
      var hits = 0;
      item.tags.forEach(function (tag) { if (tag && s.indexOf(String(tag).toLowerCase()) >= 0) hits++; });
      if (hits > bestHits) { bestHits = hits; best = item; }
    });
    if (best) return { pair: { zh: best.a.zh, en: best.a.en }, book: best.ref };
    var d = window.PROFESSOR_DEFAULT[st.defaultIdx % window.PROFESSOR_DEFAULT.length];
    st.defaultIdx = (st.defaultIdx + 1) % window.PROFESSOR_DEFAULT.length;
    var books = window.BOOKS.map(function (b) { return b.id; });
    return { pair: { zh: d.a.zh, en: d.a.en }, book: books[Math.floor(Math.random() * books.length)] };
  }

  /* ---------------- 信件柜 ---------------- */
  function renderLetters() {
    var host = el.tabLetters;
    clear(host);
    host.appendChild(mk('h3', null, t('lettersTitle')));
    host.appendChild(mk('p', 'sec-hint', t('lettersSub')));
    host.appendChild(mk('div', 'quota', t('lettersCount').replace('{n}', st.letters.length)));
    if (!st.letters.length) { host.appendChild(mk('div', 'letter-empty-box', t('lettersEmpty'))); return; }
    var grid = mk('div', 'letters');
    st.letters.slice().reverse().forEach(function (idx) {
      var lt = window.LETTERS[idx];
      var card = mk('div', 'letter-card');
      card.appendChild(window.Pixel.letter(2, THEME));
      card.appendChild(mk('div', 'lt', L(lt.title)));
      card.addEventListener('click', function () { showLetter(idx, false); });
      grid.appendChild(card);
    });
    host.appendChild(grid);
    if (st.letters.length < window.LETTERS.length) {
      host.appendChild(mk('p', 'sec-hint', (st.lang === 'zh' ? '还差 ' + (window.LETTERS.length - st.letters.length) + ' 封；每点一次帽子掉一封，顺序推进。' : (window.LETTERS.length - st.letters.length) + ' to go — each tap advances the queue.')));
    }
  }

  /* ---------------- 开场 ---------------- */
  function showIntro() {
    var box = mk('div');
    box.appendChild(mk('p', 'letter-body', L({ zh: window.I18N.zh.introBody, en: window.I18N.en.introBody })));
    var flow = mk('p', 'why', L({
      zh: '每日流程：① 绿书签心情 → ② 读一本书的一节，加一句进清单 → ③ 做十题并读完解释 → ④ 有问题用掉一次提问（每天十次）。点帽子换中英文，同时掉一封信。',
      en: 'Daily flow: ① log your mood in the green book → ② read one section, add one line to the list → ③ take the ten questions and read every explanation → ④ spend one question on the professor (ten a day). Tapping the hat switches language and drops a letter.'
    }));
    box.appendChild(flow);
    box.appendChild(mk('p', 'why', window.I18N[st.lang].safety));
    openModal(t('introTitle'), box);
  }

  /* ---------------- 初始化 ---------------- */
  function init() {
    ['appTitle', 'appSub', 'shelfTitle', 'shelfHint', 'label1', 'label2', 'label3', 'hatHint', 'tBook', 'tMemory', 'tExam', 'tAsk', 'tLetters',
      'kDate', 'vDate', 'kAsk', 'vAsk', 'kExam', 'vExam', 'kMood', 'vMood', 'vLang', 'safetyBox', 'footNote', 'resetBtn',
      'row1', 'row2', 'row3', 'tabs', 'tabBook', 'tabMemory', 'tabExam', 'tabAsk', 'tabLetters', 'profStack', 'letterDrop',
      'modal', 'modalTitle', 'modalBody', 'modalClose', 'toast', 'petals'].forEach(function (id) {
      el[id] = document.getElementById(id);
    });
    el.panel = document.querySelector('.panel');

    Array.prototype.forEach.call(el.tabs.querySelectorAll('.ico'), function (sp) {
      var n = sp.dataset.ico;
      if (n === 'letter') sp.appendChild(window.Pixel.letter(1, THEME));
      else if (n) sp.appendChild(window.Pixel.icon(n, 1, '#3a2438'));
    });

    buildPerson();
    bindEvents();
    makePetals();
    applyStatic();
    var deep = (location.hash.match(/book=([a-z]+)/) || [])[1];
    if (deep && bookById(deep)) selectedBook = bookById(deep);
    buildShelf();
    switchTab('book');

    if (st.firstTime) {
      st.firstTime = false; save();
      showIntro();
    }
  }

  function bindEvents() {
    el.tabs.addEventListener('click', function (e) {
      var b = e.target.closest('.tab');
      if (b) switchTab(b.dataset.tab);
    });
    el.modalClose.addEventListener('click', closeModal);
    el.modal.addEventListener('click', function (e) { if (e.target === el.modal) closeModal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
    el.vMood.addEventListener('click', function () { selectBook('moodmap'); });
    el.resetBtn.addEventListener('click', function () {
      if (!confirm(t('confirmReset'))) return;
      try { localStorage.removeItem(KEY); } catch (err) {}
      st = defaults();
      examSession = null; selectedBook = null;
      buildPerson(); applyStatic(); renderAll(); switchTab('book');
    });
  }

  function makePetals() {
    if (!el.petals) return;
    for (var i = 0; i < 10; i++) {
      var p = mk('div', 'petal');
      p.style.left = (i * 9.5 + Math.random() * 6) + '%';
      p.style.animationDuration = (14 + Math.random() * 12) + 's';
      p.style.animationDelay = (-Math.random() * 14) + 's';
      el.petals.appendChild(p);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
